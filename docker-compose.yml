name: watchtrace

services:
  localstack:
    image: localstack/localstack:4.8.1
    environment:
      SERVICES: sqs
      DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${WATCHTRACE_LOCALSTACK_PORT:-4566}:4566"
    tmpfs:
      - /var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    ports:
      - "127.0.0.1:${WATCHTRACE_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${WATCHTRACE_MAILPIT_HTTP_PORT:-8025}:8025"
    restart: unless-stopped

  postgres:
    image: postgres:18.4-bookworm
    env_file:
      - ${WATCHTRACE_POSTGRES_ENV_FILE:-./deploy/local/postgres.env}
    ports:
      - "127.0.0.1:${WATCHTRACE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:
