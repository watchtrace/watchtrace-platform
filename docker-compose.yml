name: watchtrace

services:
  postgres:
    image: postgres:18.4-bookworm
    env_file:
      - ${WATCHTRACE_POSTGRES_ENV_FILE:-./deploy/local/postgres.env}
    ports:
      - "127.0.0.1:${WATCHTRACE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres_data:
