name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  # Keep a production deployment alive when another main commit arrives. Pull
  # request runs can still be replaced by a newer commit on the same branch.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Build, test, and verify PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Check generated SQLC code
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f db/sqlc.yaml
          git diff --exit-code -- db internal/platform/database/sqlc

      - name: Vet packages
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Build commands
        run: go build ./...

      - name: Run PostgreSQL migration and query tests
        run: ./tests/integration/postgres-database.sh

      - name: Verify repeatable Phase 1 SQS provisioning
        run: ./tests/integration/sqs-provision.sh

  container:
    name: Build native and Linux ARM64 images
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate private Coolify Compose configuration
        run: |
          ./tests/integration/coolify-compose.sh
          ./tests/integration/coolify-deploy.sh

      - name: Build and smoke-test native image
        run: |
          ./tests/integration/backend-image.sh
          ./tests/integration/worker-image.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.35.0
          driver-opts: |
            image=moby/buildkit:v0.27.1@sha256:1e110c71d389d6d24f67b9438e2f7b8da749a6ff407b22a1631e025c95599368

      - name: Build Linux ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag watchtrace-platform:ci-arm64 \
            --load \
            .
          test "$(docker image inspect --format '{{.Architecture}}' watchtrace-platform:ci-arm64)" = "arm64"
          docker buildx build \
            --file Dockerfile.worker \
            --platform linux/arm64 \
            --tag watchtrace-worker:ci-arm64 \
            --load \
            .
          test "$(docker image inspect --format '{{.Architecture}}' watchtrace-worker:ci-arm64)" = "arm64"

  publish:
    name: Publish Linux AMD64 and ARM64 images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: watchtrace-platform
            dockerfile: Dockerfile
            cache_scope: control-image
          - image: watchtrace-worker
            dockerfile: Dockerfile.worker
            cache_scope: worker-image
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Attest published image
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record immutable deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p .release
          printf '%s\n' "$IMAGE_DIGEST" > ".release/${{ matrix.image }}.digest"
          echo "${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain published image digest for the deploy job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-digest-${{ matrix.image }}
          path: .release/${{ matrix.image }}.digest
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy backend Compose resource to prod
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.COOLIFY_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: prod
      url: ${{ vars.WATCHTRACE_PUBLIC_URL }}
    permissions:
      actions: read
      contents: read
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_BACKEND_UUID: ${{ vars.COOLIFY_BACKEND_UUID }}
      WATCHTRACE_PUBLIC_URL: ${{ vars.WATCHTRACE_PUBLIC_URL }}
      CONTROL_IMAGE: ghcr.io/${{ github.repository_owner }}/watchtrace-platform
      WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/watchtrace-worker
    steps:
      - name: Check out the tested deployment helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download immutable control-image digest
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: production-digest-watchtrace-platform
          path: .release

      - name: Download immutable worker-image digest
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: production-digest-watchtrace-worker
          path: .release

      - name: Validate production deployment configuration
        run: |
          for variable_name in \
            COOLIFY_API_URL COOLIFY_TOKEN COOLIFY_BACKEND_UUID WATCHTRACE_PUBLIC_URL; do
            eval "variable_value=\${$variable_name:-}"
            if [ -z "$variable_value" ]; then
              echo "$variable_name must be configured for the prod environment."
              exit 1
            fi
          done
          test -s .release/watchtrace-platform.digest
          test -s .release/watchtrace-worker.digest

      - name: Update backend image digests and deploy once
        id: deploy_backend
        run: |
          ./scripts/coolify-deploy.sh deploy-compose \
            "$COOLIFY_BACKEND_UUID" \
            "$CONTROL_IMAGE" "$(tr -d '\r\n' < .release/watchtrace-platform.digest)" \
            "$WORKER_IMAGE" \
            "$(tr -d '\r\n' < .release/watchtrace-worker.digest)"

      - name: Run public production acceptance checks
        run: ./scripts/verify-private-deployment.sh "$WATCHTRACE_PUBLIC_URL"

      - name: Create production release record
        env:
          PREVIOUS_CONTROL_REFERENCE: ${{ steps.deploy_backend.outputs.previous_control_reference }}
          CONTROL_REFERENCE: ${{ steps.deploy_backend.outputs.control_reference }}
          PREVIOUS_WORKER_REFERENCE: ${{ steps.deploy_backend.outputs.previous_worker_reference }}
          WORKER_REFERENCE: ${{ steps.deploy_backend.outputs.worker_reference }}
          BACKEND_DEPLOYMENT_UUID: ${{ steps.deploy_backend.outputs.deployment_uuid }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg previous_control "$PREVIOUS_CONTROL_REFERENCE" \
            --arg control "$CONTROL_REFERENCE" \
            --arg previous_worker "$PREVIOUS_WORKER_REFERENCE" \
            --arg worker "$WORKER_REFERENCE" \
            --arg backend_deployment "$BACKEND_DEPLOYMENT_UUID" \
            '{repository:$repository,commit:$commit,workflow_run:$workflow_run,timestamp:$timestamp,environment:"prod",migration_succeeded:true,images:{control:{previous:$previous_control,current:$control},worker:{previous:$previous_worker,current:$worker}},coolify_deployment:$backend_deployment}' \
            > production-release.json

      - name: Retain production release record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-production-release-${{ github.sha }}
          path: production-release.json
          if-no-files-found: error
          retention-days: 90
