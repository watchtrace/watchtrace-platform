name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and verify PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Check generated SQLC code
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f db/sqlc.yaml
          git diff --exit-code -- db internal/platform/database/sqlc

      - name: Vet packages
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Build commands
        run: go build ./...

      - name: Run PostgreSQL migration and query tests
        run: ./tests/integration/postgres-database.sh

      - name: Verify repeatable Phase 1 SQS provisioning
        run: ./tests/integration/sqs-provision.sh

  container:
    name: Build native and Linux ARM64 images
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate private Coolify Compose configuration
        run: ./tests/integration/coolify-compose.sh

      - name: Build and smoke-test native image
        run: |
          ./tests/integration/backend-image.sh
          ./tests/integration/worker-image.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.35.0
          driver-opts: |
            image=moby/buildkit:v0.27.1@sha256:1e110c71d389d6d24f67b9438e2f7b8da749a6ff407b22a1631e025c95599368

      - name: Build Linux ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag watchtrace-platform:ci-arm64 \
            --load \
            .
          test "$(docker image inspect --format '{{.Architecture}}' watchtrace-platform:ci-arm64)" = "arm64"
          docker buildx build \
            --file Dockerfile.worker \
            --platform linux/arm64 \
            --tag watchtrace-worker:ci-arm64 \
            --load \
            .
          test "$(docker image inspect --format '{{.Architecture}}' watchtrace-worker:ci-arm64)" = "arm64"

  publish:
    name: Publish Linux AMD64 and ARM64 images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: watchtrace-platform
            dockerfile: Dockerfile
            cache_scope: control-image
          - image: watchtrace-worker
            dockerfile: Dockerfile.worker
            cache_scope: worker-image
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Attest published image
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record immutable deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Trigger prod deployment in Coolify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.COOLIFY_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Trigger authenticated Coolify deploy webhook
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK and COOLIFY_TOKEN must both be configured."
            exit 1
          fi
          case "$COOLIFY_DEPLOY_WEBHOOK" in
            https://*) ;;
            *) echo "COOLIFY_DEPLOY_WEBHOOK must use HTTPS."; exit 1 ;;
          esac
          curl --fail --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 30 \
            --output /dev/null \
            --request POST \
            "$COOLIFY_DEPLOY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
          echo "Coolify accepted the prod deployment request." >> "$GITHUB_STEP_SUMMARY"
