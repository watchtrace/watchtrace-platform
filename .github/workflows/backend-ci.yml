name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and verify PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Check generated SQLC code
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f db/sqlc.yaml
          git diff --exit-code -- db internal/platform/database/sqlc

      - name: Vet packages
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Build commands
        run: go build ./...

      - name: Run PostgreSQL migration and query tests
        run: ./tests/integration/postgres-database.sh

  container:
    name: Build native and Linux ARM64 images
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and smoke-test native image
        run: ./tests/integration/backend-image.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          version: v0.35.0
          driver-opts: |
            image=moby/buildkit:v0.27.1@sha256:1e110c71d389d6d24f67b9438e2f7b8da749a6ff407b22a1631e025c95599368

      - name: Build Linux ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag watchtrace-platform:ci-arm64 \
            --load \
            .
          test "$(docker image inspect --format '{{.Architecture}}' watchtrace-platform:ci-arm64)" = "arm64"
