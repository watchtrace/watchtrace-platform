openapi: 3.0.3
info:
  title: WatchTrace customer API
  version: 1.0.0
  description: Frozen Phase 1 backend contract. Timestamps are RFC 3339 UTC. SSE messages are refresh hints; clients reload current state through ordinary APIs.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/signup: {post: {operationId: signup, security: [], requestBody: {$ref: '#/components/requestBodies/Credentials'}, responses: {'201': {$ref: '#/components/responses/Auth'}, '422': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}}
  /auth/login: {post: {operationId: login, security: [], requestBody: {$ref: '#/components/requestBodies/Credentials'}, responses: {'200': {$ref: '#/components/responses/Auth'}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}}
  /auth/refresh: {post: {operationId: refresh, security: [{refreshCookie: []}], responses: {'200': {$ref: '#/components/responses/Auth'}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}}
  /auth/logout: {post: {operationId: logout, security: [{refreshCookie: []}], requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {all_sessions: {type: boolean}}}}}}, responses: {'204': {description: Session revoked}, '401': {$ref: '#/components/responses/Error'}}}}
  /auth/me: {get: {operationId: currentUser, responses: {'200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/UserEnvelope'}}}}, '401': {$ref: '#/components/responses/Error'}}}}
  /auth/verify-email: {post: {operationId: verifyEmail, security: [], requestBody: {$ref: '#/components/requestBodies/Token'}, responses: {'200': {description: Verified user, content: {application/json: {schema: {$ref: '#/components/schemas/UserEnvelope'}}}}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}}
  /auth/forgot-password: {post: {operationId: forgotPassword, security: [], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email, maxLength: 254}}}}}}, responses: {'202': {description: Accepted regardless of account existence}, '429': {$ref: '#/components/responses/RateLimited'}}}}
  /auth/reset-password: {post: {operationId: resetPassword, security: [], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [token, new_password], properties: {token: {type: string, maxLength: 128}, new_password: {type: string, minLength: 12, maxLength: 1024}}}}}}, responses: {'204': {description: Password reset and sessions revoked}, '400': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}}
  /auth/accept-invitation: {post: {operationId: acceptInvitation, requestBody: {$ref: '#/components/requestBodies/Token'}, responses: {'201': {description: Membership created, content: {application/json: {schema: {$ref: '#/components/schemas/Membership'}}}}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}}}}
  /organizations:
    get: {operationId: listOrganizations, responses: {'200': {description: Accessible organizations with effective role and allowed actions, content: {application/json: {schema: {type: object, required: [organizations], properties: {organizations: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Organization'}}}}}}}, '401': {$ref: '#/components/responses/Error'}}}
    post: {operationId: createOrganizationHierarchy, requestBody: {required: true, content: {application/json: {schema: {type: object, required: [organization, project], properties: {organization: {$ref: '#/components/schemas/OrganizationMutation'}, project: {$ref: '#/components/schemas/ProjectMutation'}}}}}}, responses: {'201': {description: 'Organization, owner membership, project, and production environment', content: {application/json: {schema: {$ref: '#/components/schemas/DefaultOwnership'}}}}, '409': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
  '/organizations/{orgId}':
    parameters: [{$ref: '#/components/parameters/OrgId'}]
    get: {operationId: getOrganization, responses: {'200': {description: Organization, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}, '404': {$ref: '#/components/responses/Error'}}}
    put: {operationId: updateOrganization, requestBody: {$ref: '#/components/requestBodies/OrganizationMutation'}, responses: {'200': {description: Updated organization, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}, '403': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
    delete: {operationId: deleteOrganization, responses: {'204': {description: Soft deleted by owner}, '403': {$ref: '#/components/responses/Error'}}}
  '/organizations/{orgId}/members':
    parameters: [{$ref: '#/components/parameters/OrgId'}]
    get: {operationId: listMembers, responses: {'200': {description: Current members, content: {application/json: {schema: {$ref: '#/components/schemas/MemberList'}}}}, '404': {$ref: '#/components/responses/Error'}}}
  '/organizations/{orgId}/members/{memberId}':
    parameters: [{$ref: '#/components/parameters/OrgId'}, {$ref: '#/components/parameters/MemberId'}]
    patch: {operationId: updateMember, description: Members may update their own notification preference; owner/admin role rules are enforced server-side., requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemberMutation'}}}}, responses: {'200': {description: Updated member, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}, '403': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: removeMember, responses: {'204': {description: Member removed}, '403': {$ref: '#/components/responses/Error'}}}
  '/organizations/{orgId}/invitations':
    parameters: [{$ref: '#/components/parameters/OrgId'}]
    post: {operationId: inviteMember, requestBody: {required: true, content: {application/json: {schema: {type: object, required: [email, role], properties: {email: {type: string, format: email}, role: {$ref: '#/components/schemas/AssignableRole'}}}}}}, responses: {'201': {description: Invitation created, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}, '403': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
  '/organizations/{orgId}/projects':
    parameters: [{$ref: '#/components/parameters/OrgId'}]
    get: {operationId: listProjects, responses: {'200': {description: Projects, content: {application/json: {schema: {type: object, properties: {projects: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Project'}}}}}}}}}
    post: {operationId: createProject, requestBody: {$ref: '#/components/requestBodies/ProjectMutation'}, responses: {'201': {description: Project created, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}, '403': {$ref: '#/components/responses/Error'}}}
  '/projects/{projectId}':
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get: {operationId: getProject, responses: {'200': {description: Project, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}, '404': {$ref: '#/components/responses/Error'}}}
    put: {operationId: updateProject, requestBody: {$ref: '#/components/requestBodies/ProjectMutation'}, responses: {'200': {description: Project updated, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}, '403': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deleteProject, responses: {'204': {description: Empty project deleted}, '409': {$ref: '#/components/responses/Error'}}}
  '/projects/{projectId}/environments':
    parameters: [{$ref: '#/components/parameters/ProjectId'}]
    get: {operationId: listEnvironments, responses: {'200': {description: Environments, content: {application/json: {schema: {type: object, properties: {environments: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Environment'}}}}}}}}}
    post: {operationId: createEnvironment, requestBody: {$ref: '#/components/requestBodies/EnvironmentMutation'}, responses: {'201': {description: Environment created, content: {application/json: {schema: {$ref: '#/components/schemas/Environment'}}}}, '403': {$ref: '#/components/responses/Error'}}}
  '/environments/{environmentId}':
    parameters: [{$ref: '#/components/parameters/EnvironmentId'}]
    get: {operationId: getEnvironment, responses: {'200': {description: Environment, content: {application/json: {schema: {$ref: '#/components/schemas/Environment'}}}}, '404': {$ref: '#/components/responses/Error'}}}
    put: {operationId: updateEnvironment, requestBody: {$ref: '#/components/requestBodies/EnvironmentMutation'}, responses: {'200': {description: Environment updated, content: {application/json: {schema: {$ref: '#/components/schemas/Environment'}}}}, '403': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deleteEnvironment, responses: {'204': {description: Empty environment deleted}, '409': {$ref: '#/components/responses/Error'}}}
  '/environments/{environmentId}/monitors':
    parameters: [{$ref: '#/components/parameters/EnvironmentId'}]
    get: {operationId: listMonitors, responses: {'200': {description: At most 100 monitors, content: {application/json: {schema: {type: object, properties: {monitors: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Monitor'}}}}}}}}}
    post: {operationId: createMonitor, requestBody: {$ref: '#/components/requestBodies/MonitorMutation'}, responses: {'201': {description: Monitor created, content: {application/json: {schema: {$ref: '#/components/schemas/Monitor'}}}}, '403': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
  '/environments/{environmentId}/monitors/{monitorId}':
    parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/MonitorId'}]
    get: {operationId: getMonitor, responses: {'200': {description: Monitor state and recent checks, content: {application/json: {schema: {$ref: '#/components/schemas/MonitorDetail'}}}}, '404': {$ref: '#/components/responses/Error'}}}
    put: {operationId: updateMonitor, requestBody: {$ref: '#/components/requestBodies/MonitorMutation'}, responses: {'200': {description: Monitor updated, content: {application/json: {schema: {$ref: '#/components/schemas/Monitor'}}}}, '403': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deleteMonitor, responses: {'204': {description: Monitor soft deleted}, '403': {$ref: '#/components/responses/Error'}}}
  '/environments/{environmentId}/monitors/{monitorId}/test': {post: {operationId: testMonitor, parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/MonitorId'}], responses: {'202': {description: Manual check admitted, content: {application/json: {schema: {type: object, required: [job_id], properties: {job_id: {type: string, format: uuid}}}}}}, '403': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}}
  '/environments/{environmentId}/monitors/{monitorId}/pause': {post: {operationId: pauseMonitor, parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/MonitorId'}], responses: {'200': {description: Monitor paused, content: {application/json: {schema: {$ref: '#/components/schemas/Monitor'}}}}, '403': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}}
  '/environments/{environmentId}/monitors/{monitorId}/resume': {post: {operationId: resumeMonitor, parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/MonitorId'}], responses: {'200': {description: Monitor resumed, content: {application/json: {schema: {$ref: '#/components/schemas/Monitor'}}}}, '403': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}}
  '/environments/{environmentId}/monitors/{monitorId}/checks':
    get: {operationId: listChecks, parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/MonitorId'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}, {name: job_type, in: query, schema: {type: string, enum: [scheduled, manual]}}], responses: {'200': {description: Stable newest-first page, content: {application/json: {schema: {$ref: '#/components/schemas/CheckPage'}}}}, '422': {$ref: '#/components/responses/Error'}}}
  '/environments/{environmentId}/monitors/{monitorId}/report':
    get: {operationId: monitorReport, parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/MonitorId'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}], responses: {'200': {description: 'Scheduled-only uptime, coverage, latency, and freshness', content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}, '422': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/RateLimited'}}}
  '/environments/{environmentId}/dashboard':
    get: {operationId: dashboard, parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}], responses: {'200': {description: Polling reconstruction snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/Dashboard'}}}}, '429': {$ref: '#/components/responses/RateLimited'}}}
  '/environments/{environmentId}/incidents':
    get: {operationId: listIncidents, parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}, {name: status, in: query, schema: {type: string, enum: [open, resolved]}}], responses: {'200': {description: Stable newest-first incident page, content: {application/json: {schema: {$ref: '#/components/schemas/IncidentPage'}}}}, '422': {$ref: '#/components/responses/Error'}}}
  '/environments/{environmentId}/incidents/{incidentId}':
    get: {operationId: getIncident, parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/IncidentId'}], responses: {'200': {description: 'Incident, bounded timeline, and notification state', content: {application/json: {schema: {$ref: '#/components/schemas/IncidentSummary'}}}}, '404': {$ref: '#/components/responses/Error'}}}
  '/environments/{environmentId}/incidents/{incidentId}/acknowledge': {post: {operationId: acknowledgeIncident, parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/IncidentId'}], requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {reason: {type: string, maxLength: 500}}}}}}, responses: {'200': {description: Incident acknowledged, content: {application/json: {schema: {$ref: '#/components/schemas/IncidentSummary'}}}}, '403': {$ref: '#/components/responses/Error'}}}}
  '/environments/{environmentId}/incidents/{incidentId}/resolve': {post: {operationId: resolveIncident, parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {$ref: '#/components/parameters/IncidentId'}], requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {reason: {type: string, maxLength: 500}}}}}}, responses: {'200': {description: Incident manually resolved, content: {application/json: {schema: {$ref: '#/components/schemas/IncidentSummary'}}}}, '403': {$ref: '#/components/responses/Error'}}}}
  '/environments/{environmentId}/events':
    get:
      operationId: streamEvents
      description: Authorized durable refresh hints. Last-Event-ID replays at most 100 events; ordinary APIs remain the source of truth.
      parameters: [{$ref: '#/components/parameters/EnvironmentId'}, {name: Last-Event-ID, in: header, schema: {type: integer, minimum: 0}}]
      responses:
        '200': {description: 'SSE stream containing only event ID, type, resource_type, and resource_id', content: {text/event-stream: {schema: {type: string}}}}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}, refreshCookie: {type: apiKey, in: cookie, name: watchtrace_refresh}}
  parameters:
    OrgId: {name: orgId, in: path, required: true, schema: {type: string, format: uuid}}
    MemberId: {name: memberId, in: path, required: true, schema: {type: string, format: uuid}}
    ProjectId: {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
    EnvironmentId: {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
    MonitorId: {name: monitorId, in: path, required: true, schema: {type: string, format: uuid}}
    IncidentId: {name: incidentId, in: path, required: true, schema: {type: string, format: uuid}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 256}}
    From: {name: from, in: query, required: true, schema: {type: string, format: date-time}}
    To: {name: to, in: query, required: true, schema: {type: string, format: date-time}}
  requestBodies:
    Credentials: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [email, password], properties: {email: {type: string, format: email, maxLength: 254}, password: {type: string, minLength: 12, maxLength: 1024}}}}}}
    Token: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [token], properties: {token: {type: string, maxLength: 128}}}}}}
    OrganizationMutation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationMutation'}}}}
    ProjectMutation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectMutation'}}}}
    EnvironmentMutation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EnvironmentMutation'}}}}
    MonitorMutation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MonitorMutation'}}}}
  responses:
    Auth: {description: Access token response; refresh token is an HttpOnly SameSite=Strict cookie, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}}}
    Error: {description: Stable safe error envelope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    RateLimited: {description: Bounded rate exceeded, headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Role: {type: string, enum: [owner, admin, member, viewer]}
    AssignableRole: {type: string, enum: [admin, member, viewer]}
    AllowedActions: {type: array, uniqueItems: true, items: {type: string, enum: ['tenant:read','tenant:manage','members:read','members:invite','members:manage','monitors:read','monitors:manage','incidents:read','incidents:manage']}}
    User: {type: object, required: [id,email,email_verified], properties: {id: {type: string, format: uuid}, email: {type: string, format: email}, email_verified: {type: boolean}}}
    UserEnvelope: {type: object, required: [user], properties: {user: {$ref: '#/components/schemas/User'}}}
    AuthResponse: {type: object, required: [user,session], properties: {user: {$ref: '#/components/schemas/User'}, session: {type: object, required: [token,token_type,expires_at], properties: {token: {type: string}, token_type: {type: string, enum: [Bearer]}, expires_at: {type: string, format: date-time}}}}}
    Membership: {type: object, required: [organization_id,user_id,role], properties: {organization_id: {type: string, format: uuid}, user_id: {type: string, format: uuid}, role: {$ref: '#/components/schemas/Role'}}}
    Member: {type: object, required: [user_id,email,role,incident_notifications_enabled,created_at], properties: {user_id: {type: string, format: uuid}, email: {type: string, format: email}, role: {$ref: '#/components/schemas/Role'}, incident_notifications_enabled: {type: boolean}, created_at: {type: string, format: date-time}}}
    MemberList: {type: object, required: [members], properties: {members: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Member'}}}}
    Invitation: {type: object, required: [organization_id,email,role,expires_at], properties: {organization_id: {type: string, format: uuid}, email: {type: string, format: email}, role: {$ref: '#/components/schemas/AssignableRole'}, expires_at: {type: string, format: date-time}}}
    Organization: {type: object, required: [id,name,slug,role,allowed_actions], properties: {id: {type: string, format: uuid}, name: {type: string}, slug: {type: string}, role: {$ref: '#/components/schemas/Role'}, allowed_actions: {$ref: '#/components/schemas/AllowedActions'}, created_at: {type: string, format: date-time}}}
    OrganizationMutation: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 120}, slug: {type: string, maxLength: 63}}}
    Project: {type: object, required: [id,organization_id,name,role,allowed_actions], properties: {id: {type: string, format: uuid}, organization_id: {type: string, format: uuid}, name: {type: string}, description: {type: string}, role: {$ref: '#/components/schemas/Role'}, allowed_actions: {$ref: '#/components/schemas/AllowedActions'}}}
    ProjectMutation: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 120}, description: {type: string, maxLength: 1000}}}
    Environment: {type: object, required: [id,organization_id,project_id,name,type,role,allowed_actions], properties: {id: {type: string, format: uuid}, organization_id: {type: string, format: uuid}, project_id: {type: string, format: uuid}, name: {type: string}, type: {type: string, enum: [production,staging,development]}, role: {$ref: '#/components/schemas/Role'}, allowed_actions: {$ref: '#/components/schemas/AllowedActions'}}}
    DefaultOwnership: {type: object, required: [organization,membership,project,environment], properties: {organization: {$ref: '#/components/schemas/Organization'}, membership: {$ref: '#/components/schemas/Membership'}, project: {$ref: '#/components/schemas/Project'}, environment: {$ref: '#/components/schemas/Environment'}}}
    EnvironmentMutation: {type: object, additionalProperties: false, required: [name,type], properties: {name: {type: string, minLength: 1, maxLength: 120}, type: {type: string, enum: [production,staging,development]}}}
    MemberMutation: {type: object, additionalProperties: false, properties: {role: {$ref: '#/components/schemas/AssignableRole'}, incident_notifications_enabled: {type: boolean}}, minProperties: 1}
    Monitor: {type: object, required: [id,organization_id,environment_id,name,url,method,interval_seconds,timeout_seconds,expected_status_min,expected_status_max,version,paused,worker_pool_id,header_names], properties: {id: {type: string, format: uuid}, organization_id: {type: string, format: uuid}, environment_id: {type: string, format: uuid}, name: {type: string}, url: {type: string, format: uri}, method: {type: string, enum: [GET,HEAD]}, interval_seconds: {type: integer, enum: [60,120,300,600,1800]}, timeout_seconds: {type: integer, minimum: 1, maximum: 10}, expected_status_min: {type: integer}, expected_status_max: {type: integer}, version: {type: integer}, paused: {type: boolean}, worker_pool_id: {type: string}, header_names: {type: array, maxItems: 32, items: {type: string}}}}
    Check: {type: object, required: [job_id,job_type,scheduled_at,started_at,completed_at,succeeded,total_duration_us], properties: {job_id: {type: string, format: uuid}, job_type: {type: string, enum: [scheduled,manual]}, scheduled_at: {type: string, format: date-time}, started_at: {type: string, format: date-time}, completed_at: {type: string, format: date-time}, succeeded: {type: boolean}, status_code: {type: integer, nullable: true}, error_category: {type: string, nullable: true}, total_duration_us: {type: integer, minimum: 0}}}
    CheckPage: {type: object, required: [items], properties: {items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Check'}}, next_cursor: {type: string, nullable: true, maxLength: 256}}}
    MonitorDetail: {allOf: [{$ref: '#/components/schemas/Monitor'}, {type: object, required: [state,recent_checks], properties: {state: {type: string, enum: [healthy,degraded,down,unknown]}, recent_checks: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Check'}}}}]}
    MonitorMutation: {type: object, additionalProperties: false, required: [name,url], properties: {name: {type: string, maxLength: 120}, url: {type: string, format: uri, maxLength: 2048}, method: {type: string, enum: [GET,HEAD]}, interval_seconds: {type: integer, enum: [60,120,300,600,1800]}, timeout_seconds: {type: integer, minimum: 1, maximum: 10}, expected_status_min: {type: integer, minimum: 100, maximum: 599}, expected_status_max: {type: integer, minimum: 100, maximum: 599}, headers: {type: object, maxProperties: 32, additionalProperties: {type: string}}, worker_pool_id: {type: string, maxLength: 63}}}
    Report: {type: object, required: [from,to,expected,observed,successful,unknown,fresh], properties: {from: {type: string, format: date-time}, to: {type: string, format: date-time}, expected: {type: integer, minimum: 0}, observed: {type: integer, minimum: 0}, successful: {type: integer, minimum: 0}, unknown: {type: integer, minimum: 0}, observed_uptime: {type: number, nullable: true, minimum: 0, maximum: 1}, coverage: {type: number, nullable: true, minimum: 0, maximum: 1}, average_latency_ms: {type: number, nullable: true, minimum: 0}, fresh: {type: boolean}, corrected_at: {type: string, nullable: true, format: date-time}}}
    StateCounts: {type: object, required: [healthy,degraded,down,unknown], properties: {healthy: {type: integer, minimum: 0}, degraded: {type: integer, minimum: 0}, down: {type: integer, minimum: 0}, unknown: {type: integer, minimum: 0}}}
    Dashboard: {type: object, required: [states,reliability,open_incidents,generated_at], properties: {states: {$ref: '#/components/schemas/StateCounts'}, reliability: {$ref: '#/components/schemas/Report'}, open_incidents: {type: integer, minimum: 0}, generated_at: {type: string, format: date-time}}}
