version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "database"
        out: "../internal/platform/database/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        omit_unused_structs: true
